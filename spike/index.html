<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LMS — Thin Slice</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  .q { border: 1px solid #ddd; border-radius: 8px; padding: .75rem 1rem; margin: 1rem 0; }
  .q h3 { margin: 0 0 .5rem; font-size: 1rem; }
  label { display: block; padding: .15rem 0; }
  #submit { margin-top: 1rem; padding: .6rem 1.4rem; font-size: 1rem; cursor: pointer; }
  #log { font: 12px/1.4 ui-monospace, monospace; color: #666; white-space: pre-wrap; margin-top: 1.5rem; }
  #score { font-size: 1.4rem; font-weight: 700; color: #1a7f37; margin-top: 1rem; }
</style>
</head>
<body>
<h1>LMS — Thin Slice</h1>
<div id="app">Memuat…</div>
<div id="score"></div>
<div id="log"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, connectAuthEmulator, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, connectFirestoreEmulator, doc, getDoc, setDoc, updateDoc, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
const exists = async (ref) => { try { return (await getDoc(ref)).exists(); } catch { return false; } };

const app = initializeApp({ projectId: "demo-lms", apiKey: "fake", authDomain: "demo-lms.firebaseapp.com" });
const auth = getAuth(app);
const db = getFirestore(app);
connectAuthEmulator(auth, "http://localhost:9099", { disableWarnings: true });
connectFirestoreEmulator(db, "localhost", 8080);

const QUIZ_ID = "q1";

async function boot() {
  // 1) auth
  const uid = (await signInAnonymously(auth)).user.uid;
  log("login anon uid=" + uid.slice(0, 8));

  // 2) onboard: users/{uid} (kelas c1) if missing
  const uref = doc(db, "users", uid);
  if (!(await exists(uref))) {
    await setDoc(uref, { nama: "Siswa " + uid.slice(0, 4), kelas: "c1" });
    log("users/" + uid.slice(0, 8) + " dibuat (kelas c1)");
  }

  // 3) read class metadata (K-BARU-13) -> build start WITHOUT reading quizzes
  const meta = (await getDoc(doc(db, "classes", "c1"))).data().quizzes[QUIZ_ID];
  const closeAt = meta.closeAt;
  const expireAt = new Timestamp(closeAt.seconds + 30 * 86400, closeAt.nanoseconds);

  // 4) create starts/{uid}_q1_1 (serverTimestamp == request.time, window toleransiMulai)
  const sref = doc(db, "starts", `${uid}_${QUIZ_ID}_1`);
  if (!(await exists(sref))) {
    await setDoc(sref, {
      uid, quizId: QUIZ_ID, attemptNo: 1,
      startedAt: serverTimestamp(),
      duration: meta.duration, closeAt: meta.closeAt, maxAttempts: 1,
      quizVersion: meta.version, keyVersion: 1, expireAt,
    });
    log("starts dibuat (serverTimestamp, durasi " + meta.duration + "m)");
  }

  // 5) now quizzes read is allowed (starts exists)
  const quiz = (await getDoc(doc(db, "quizzes", QUIZ_ID))).data();
  log("quizzes/" + QUIZ_ID + " dimuat: " + quiz.questions.length + " soal");

  // 6) render
  render(quiz, uid, expireAt);
}

function render(quiz, uid, expireAt) {
  const app = document.getElementById("app");
  app.innerHTML = "<h2>" + quiz.judul + "</h2>" + quiz.questions.map((q) =>
    `<div class="q" data-qid="${q.id}"><h3>${q.teks}</h3>` +
    Object.entries(q.pilihan).map(([k, v]) =>
      `<label><input type="radio" name="ans_${q.id}" value="${k}"> ${k}. ${v}</label>`).join("") +
    `</div>`).join("") + `<button id="submit">Kirim Jawaban</button>`;

  document.getElementById("submit").onclick = async () => {
    const answers = {};
    quiz.questions.forEach((q) => {
      const sel = document.querySelector(`input[name="ans_${q.id}"]:checked`);
      if (sel) answers[q.id] = sel.value;
    });

    // 7) write attempts/{uid}_q1_1 (create then update; jendela dari starts)
    const aref = doc(db, "attempts", `${uid}_${QUIZ_ID}_1`);
    const asnap = await getDoc(aref).catch(() => null);
    if (asnap && asnap.exists()) {
      await updateDoc(aref, { answers, updatedAt: serverTimestamp(), submitSeq: asnap.data().submitSeq + 1 });
    } else {
      await setDoc(aref, { answers, updatedAt: serverTimestamp(), submitSeq: 1, uid, quizId: QUIZ_ID, attemptNo: 1, expireAt });
    }
    log("attempts dikirim: " + Object.keys(answers).length + "/" + quiz.questions.length + " dijawab");

    // 8) grade in-browser (practice) + write progress/{uid}
    let benar = 0;
    quiz.questions.forEach((q) => { if (answers[q.id] === q.kunci) benar++; });
    const pct = Math.round((benar / quiz.questions.length) * 100);
    await setDoc(doc(db, "progress", uid), { xp: pct, quizScores: { [QUIZ_ID]: pct }, updatedAt: serverTimestamp() }, { merge: true });
    log("progress/" + uid.slice(0, 8) + " ditulis (xp=" + pct + ")");

    document.getElementById("score").textContent = `Skor: ${benar}/${quiz.questions.length} (${pct}%)`;
    document.getElementById("submit").disabled = true;
    window.__sliceDone = { benar, total: quiz.questions.length, pct };
  };
}

boot().catch((e) => { log("ERROR: " + e.message); document.getElementById("app").textContent = "Gagal: " + e.message; });
</script>
</body>
</html>
