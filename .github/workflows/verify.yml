name: Verify LMS Build & Standards

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 (Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Spike Rules Dependencies
        run: npm --prefix spike ci

      - name: Verify Code Size Standards
        run: node tools/check-size.mjs

      - name: Run Unit & Smoke Tests
        run: |
          node spike/scoring.test.mjs
          node spike/import.test.mjs
          node spike/quiz-utils.test.mjs
          node spike/export.test.mjs
          node spike/submission-queue.test.mjs
          node spike/attempt-queue.test.mjs
          node tests/smoke.test.mjs

      - name: Run Firestore Security Rules Tests
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-lms "node spike/rules.test.mjs"
